# To enable GitHub Actions, copy this file to .github/workflows/validate.yml
# using a GitHub identity permitted to create workflows.
name: Validate alpha
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'macOS'
        run: python -m pip install -e '.[mac]'
      - run: python -m unittest discover -v
      - run: python scripts/stress_gateway.py --attempts 6000 --soak-seconds 60
