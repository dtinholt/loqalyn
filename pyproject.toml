[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "switchyard-local"
version = "0.3.0a2"
description = "A local-first model gateway for Ollama and LM Studio on macOS"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiohttp==3.14.5", "PyYAML==6.0.3", "jsonschema==4.26.0", "keyring==25.7.0", "apsw==3.54.0.0"]

[project.optional-dependencies]
mac = ["pyobjc-core==12.2.2", "pyobjc-framework-Cocoa==12.2.2"]

[project.scripts]
yard = "switchyard.cli:main"

[tool.setuptools.packages.find]
include = ["switchyard*"]
